    <style>
      /* Shown between first paint and React mounting, then removed. Inlined so
         it needs no network round-trip of its own. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.25rem;
        background: #fff;
        z-index: 9999;
      }
      #boot img {
        width: 104px;
        height: 104px;
        animation: boot-flip 2.4s cubic-bezier(0.45, 0.05, 0.3, 1) infinite;
      }
      #boot p {
        margin: 0;
        font: 600 1.05rem/1 system-ui, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #113a6b;
      }
      @keyframes boot-flip {
        0%,
        12% {
          transform: rotateY(0deg);
        }
        50%,
        62% {
          transform: rotateY(180deg);
        }
        100% {
          transform: rotateY(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img {
          animation: none;
        }
      }
    </style>

  <body>
